name: Web build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  next-build:
    name: Next.js production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: "https://adresse-gn-ci.invalid"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "ci-public-placeholder-key"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.6.2

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Lint Next.js frontend
        run: npm --workspace web run lint -- --max-warnings=0

      - name: Build Next.js frontend
        run: npm --workspace web run build
